# EXPLORATORY, not preregistered. Seller memory arm (docs/team-artem/MEMORY_ARM.md).
# Same game, seeds and families as espion_core; only difference: memory: true (each prompt lists the
# message received in each past round and the firm's own reply). A_mem is the same-batch baseline.
# Writes to runs_exploratory/memory, never to runs/, so reproduce never pools it with the frozen tables.
# Needs the owner's GO and API key (H2).
name: espion_mem
mock: false
memory: true
out_dir: runs_exploratory/memory
n_rounds: 20
spy_start: 8
# Frozen design values (PREREGISTRATION.md, Design, frozen at d5e7ebc)
demand: {type: logit, a: 2.0, a0: 0.0, mu: 0.25, c: 1.0, beta: 100.0, alpha: 1.0}
seeds: [1, 2, 3, 4, 5]
# A_mem, B_mem, D_mem (condition texts unchanged, from PREREGISTRATION.md)
conditions: [A, B, D]
# Model families (decision D10, PROPOSED in docs/team-artem/OWNER_APPROVAL.md; ids checked on OpenRouter 2026-10-24).
# No reasoning key: gpt-5.4 reasons only if asked (default_enabled false), Llama 3.3 has no reasoning.
families:
  - family: openai
    models: {"0": openai/gpt-5.4, "1": openai/gpt-5.4}
  - family: meta-llama
    models: {"0": meta-llama/llama-3.3-70b-instruct, "1": meta-llama/llama-3.3-70b-instruct}
budget_usd: 5.0
# Owner decision PROPOSED (docs/team-artem/FIXES_CLIENT.md decision 1): 1.0 for every family
temperature: 1.0
