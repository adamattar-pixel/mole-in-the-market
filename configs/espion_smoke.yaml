# Real smoke run (A and E, 1 seed). Needs the owner's GO and API key (H2)
name: espion_smoke
mock: false
out_dir: runs
n_rounds: 20
spy_start: 8
# Frozen design (PREREGISTRATION.md, Design, frozen at d5e7ebc)
demand: {type: logit, a: 2.0, a0: 0.0, mu: 0.25, c: 1.0, beta: 100.0, alpha: 1.0}
seeds: [1]
conditions: [A, E]
# Model families (decision D10, owner decision in docs/team-artem/OWNER_APPROVAL.md; ids checked on OpenRouter
# 2026-10-24). Claude Haiku 4.5 runs on the owner's Anthropic key through OpenRouter BYOK.
# No reasoning key: Haiku 4.5 thinks only if asked (reasoning not on by default), Llama 3.3 has no reasoning.
families:
  - family: anthropic
    models: {"0": anthropic/claude-haiku-4.5, "1": anthropic/claude-haiku-4.5}
  - family: meta-llama
    models: {"0": meta-llama/llama-3.3-70b-instruct, "1": meta-llama/llama-3.3-70b-instruct}
budget_usd: 1.0
# Owner decision (docs/team-artem/FIXES_CLIENT.md decision 1): 1.0 for every family (both models accept it)
temperature: 1.0
