# Per-model prices for the R17 budget guard (USD per 1M tokens), read by harness.clients.load_prices.
# Source: https://openrouter.ai/api/v1/models (pricing.prompt and pricing.completion x 1e6),
# fetched 2026-10-24 11:36 UTC. Not a step config. Each real call is charged
# max(usage.cost, prompt_tokens x input + completion_tokens x output) / 1e6, so a provider or account mode that
# under-reports usage.cost (for example BYOK, where it is only OpenRouter's fee) cannot get past the caps.
# The 4 models of D22 (2 primary, 2 fallback) re-checked 2026-10-24 12:06 UTC: unchanged. Other entries are
# older candidates (docs/team-artem/MODEL_AND_COST.md). Regional endpoints can cost up to 10% more.
# Every model in a real config or fallback needs an entry: a real run refuses a model without a price.
fetched: "2026-10-24"
models:
  anthropic/claude-haiku-4.5: {input: 1.00, output: 5.00}
  anthropic/claude-sonnet-4.5: {input: 3.00, output: 15.00}
  meta-llama/llama-3.3-70b-instruct: {input: 0.10, output: 0.32}
  qwen/qwen3-235b-a22b-2507: {input: 0.09, output: 0.55}
  openai/gpt-5.4: {input: 2.50, output: 15.00}
  openai/gpt-4.1: {input: 2.00, output: 8.00}
  openai/gpt-4o: {input: 2.50, output: 10.00}
