# tools/run_all (R36): settings of the one-command pipeline. The step configs (espion_smoke, espion_pilot,
# espion_core, espion_monitor, espion_ethics, exploratory/espion_mem) keep their own games, seeds and
# per-config caps; their `families` blocks must be identical (matched episodes).
# PROPOSAL (owner decides): global cap over every step, counting the spend already in the logs.
# Sum of the per-config caps: 1 + 5 + 10 + 7.5 + 2.5 = 26 USD (+ 5 memory arm, + 10 O1).
budget_usd: 30.0
# E gate (PLAN.md Phase 4): a family whose E fails is replaced ONCE by its fallback here, keyed by the
# primary family label; the fallback pilot runs as espion_pilot_fb. Fallback failing too = plan B (stop).
# The fallback label must not equal another primary family label. `fallback: {}` = no fallback.
# Placeholders until the owner gives them (a real run refuses "tbd" ids).
fallback:
  family1-tbd:
    family: family1fb-tbd
    models: {"0": family1fb-tbd/model-tbd, "1": family1fb-tbd/model-tbd}
  family2-tbd:
    family: family2fb-tbd
    models: {"0": family2fb-tbd/model-tbd, "1": family2fb-tbd/model-tbd}
# Option O1 (--o1 only, last step): espion_core with these seeds, written as espion_o1, its own cap.
o1_seeds: [6, 7, 8, 9, 10]
o1_budget_usd: 10.0
