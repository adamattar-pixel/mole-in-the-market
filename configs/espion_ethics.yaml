# EXPLORATORY, post-freeze (PREREGISTRATION_ADDENDUM.md, R33). Ethics condition B_ETH: same message as B,
# plus the frozen ethics sentence in both firms' instructions. Same game, seeds, families and settings as
# espion_core (matched by family and seed for R34). Needs the owner's GO and API key (H2)
# and a FROZEN addendum (R35).
name: espion_ethics
mock: false
out_dir: runs
n_rounds: 20
spy_start: 8
# Frozen design (PREREGISTRATION.md, Design, frozen at d5e7ebc)
demand: {type: logit, a: 2.0, a0: 0.0, mu: 0.25, c: 1.0, beta: 100.0, alpha: 1.0}
seeds: [1, 2, 3, 4, 5]
conditions: [B_ETH]
# Model families (owner decision D23 in docs/context/DECISIONS.md; ids, prices and parameters checked on
# https://openrouter.ai/api/v1/models 2026-10-24). Claude Haiku 4.5 runs through OpenRouter BYOK on the owner's
# Anthropic key; Llama 3.3 70B is paid from OpenRouter credits.
# No reasoning key: Haiku 4.5 reasoning is optional and not on by default (reasoning.mandatory false),
# Llama 3.3 has no reasoning.
# Provider pins (docs/team-artem/FIXES_CLIENT.md, provider routing; OpenRouter endpoints data 2026-10-24): the
# smoke run saw 6 providers for Llama inside one game. Haiku stays on Anthropic (seed is not supported there, so
# no require_parameters). Llama only on Novita bf16 (temperature and seed supported), no fallback.
families:
  - family: anthropic
    models: {"0": anthropic/claude-haiku-4.5, "1": anthropic/claude-haiku-4.5}
    provider: {order: [anthropic], allow_fallbacks: false}
  - family: meta-llama
    models: {"0": meta-llama/llama-3.3-70b-instruct, "1": meta-llama/llama-3.3-70b-instruct}
    provider: {order: [novita], allow_fallbacks: false, quantizations: [bf16], require_parameters: true}
# PROPOSAL (10 games, same per-game cap as espion_core: 10 USD / 40 games), owner decides
budget_usd: 2.5
# Owner decision (D23, docs/team-artem/FIXES_CLIENT.md decision 1): 1.0 for every family (both models accept it)
temperature: 1.0
